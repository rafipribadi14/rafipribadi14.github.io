    <style>
      /* Layout: one centered business card (SVG) on a plain page. */
      :root {
        --ink: #050505;
        --paper: #ffffff;
        color-scheme: light;
      }

* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding-block: 24px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  color: var(--ink);
  background: var(--paper);
  font-family: "Cormorant Garamond", Garamond, "Times New Roman", serif;
}
a, a:visited { color: inherit; text-decoration: none; }
a:hover, a:focus-visible { text-decoration: underline; }
.business-card {
  display: block;
  width: clamp(300px, 90vw, 720px);
  max-width: 100%;
  height: auto;
  color: var(--ink);
  overflow: visible;
}
.business-card text, .business-card tspan {
  fill: currentColor;
  font-family: "Cormorant Garamond", Garamond, "Times New Roman", serif;
  font-style: normal;
  dominant-baseline: hanging;
}
.small-caps { font-variant-caps: small-caps; letter-spacing: 0.02em; }
.business-card a:hover text, .business-card a:focus-visible text,
.business-card a:hover tspan, .business-card a:focus-visible tspan { text-decoration: underline; }

    </style>
